<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading</title>
    <style>
        .div1{
            width:200px;
            height:20px;
            border: 2px solid black;
            margin-left:auto;
            margin-right:auto;
            margin-top: 100px;
            border-radius: 10px;
            position: relative;
            .div2{
                width:10px;
                height:20px;
                background-color: green;
                border-radius: 10px;
                animation: loading 10s infinite;
            }
        }
        @keyframes loading {
             0%{
                transform: translate(0px);
             }
             10%{
                width: 20px;
             }
             20%{
                width: 40px;
             }
             30%{
                width: 60px;
             }
             40%{
                width:80px;
             }
             50%{
                 width: 100px;
             }
             60%{
                width:150px;
             }
             100%{
                width: 200px;
             }
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;margin-top: 50px;">Loading....</h1>
    <div class="div1">
        <div class="div2"></div>
    </div>
</body>
</html>
